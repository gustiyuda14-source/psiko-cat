<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan faktor sama" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">12,5% × 4,8 + 0,125 × 15,2</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="70" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">0,125 × 4,8</text><text x="100" y="92" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">+ 0,125 × 15,2</text><line x1="100" y1="102" x2="100" y2="122" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="100" y="144" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">0,125 × (4,8 + 15,2)</text><text x="100" y="174" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">0,125 × 20</text><text x="100" y="200" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">= 20 ÷ 8</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">12,5% = 0,125</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Keluarkan 0,125</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">4,8 + 15,2 = 20</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">20 ÷ 8</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2,5</text><g transform="translate(8,0)"><rect x="352" y="84" width="56" height="40" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="408" y="84" width="176" height="40" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="380" y="140" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">4,8</text><text x="496" y="140" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">15,2</text><text x="352" y="78" font-size="10" font-weight="400" fill="#555555" text-anchor="start">tinggi 0,125</text><path d="M352 150 q0 8 8 8 h106 q8 0 8 8 q0 -8 8 -8 h94 q8 0 8 -8" fill="none" stroke="#111111" stroke-width="1.2"/><text x="468" y="186" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">lebar 20</text><text x="348" y="214" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">ab + ac = a(b + c): dua kotak setinggi</text><text x="348" y="231" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">sama digabung jadi satu kotak.</text></g></svg>