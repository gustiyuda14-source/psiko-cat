<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 10.000 dikurangi 3.476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">10.000 − 3.476 — semua dari 9, terakhir dari 10</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="44" y="74" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">9</text><text x="84" y="74" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">9</text><text x="124" y="74" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">9</text><text x="164" y="74" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">10</text><text x="14" y="74" font-size="10" font-weight="400" fill="#555555" text-anchor="start">dari</text><text x="44" y="106" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">− 3</text><text x="84" y="106" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">− 4</text><text x="124" y="106" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">− 7</text><text x="164" y="106" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">− 6</text><line x1="24" y1="118" x2="186" y2="118" stroke="#111111" stroke-width="2"/><text x="44" y="150" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">6</text><text x="84" y="150" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">5</text><text x="124" y="150" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">2</text><text x="164" y="150" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">4</text><rect x="146" y="52" width="36" height="106" rx="6" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><text x="164" y="178" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">terakhir dari 10</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">9 − 3 = 6</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">9 − 4 = 5</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">9 − 7 = 2</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">10 − 6 = 4</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6.524</text><g transform="translate(8,0)"><text x="352" y="90" font-size="15" font-weight="700" fill="#111111" text-anchor="start">10.000 = 9.999 + 1</text><text x="352" y="118" font-size="15" font-weight="700" fill="#111111" text-anchor="start">9.999 − 3.476 = 6.523</text><text x="352" y="136" font-size="11" font-weight="400" fill="#555555" text-anchor="start">(tiap digit ≤ 9: tidak pernah meminjam)</text><text x="352" y="162" font-size="15" font-weight="700" fill="#111111" text-anchor="start">6.523 + 1 = 6.524</text><text x="348" y="200" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">+1 itu yang membuat digit terakhir</text><text x="348" y="217" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">dikurangkan dari 10.</text><text x="348" y="234" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Rp100.000 − Rp37.256 → Rp62.744</text></g></svg>