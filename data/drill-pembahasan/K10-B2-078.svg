ar 2</text><line x1="372" y1="156" x2="604" y2="156" stroke="#bbbbbb" stroke-width="0.8"/><text x="372" y="175" font-size="14" font-weight="600" fill="#111111" text-anchor="start">6² = 36</text><text x="372" y="196" font-size="14" font-weight="600" fill="#111111" text-anchor="start">?² = 81 → ? = 9</text><rect x="10" y="208" width="150" height="40" rx="8" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="85" y="235.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">? = 9</text></svg>