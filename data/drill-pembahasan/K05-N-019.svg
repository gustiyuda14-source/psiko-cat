<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan pasangan genap" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">28 + 47 + 72 + 53 + 15 — pasangan</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="30" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">28</text><text x="68" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">47</text><text x="106" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">72</text><text x="144" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">53</text><text x="180" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">15</text><text x="49" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><text x="87" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><text x="125" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><text x="162" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><path d="M30 94 Q 68 54 106 92" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="68" y="66" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">100</text><path d="M68 122 Q 106 162 144 124" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="106" y="160" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">100</text><text x="100" y="204" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">100 + 100 + 15</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">28 + 72 = 100</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">47 + 53 = 100</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Sisa + 15</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">215</text><g transform="translate(8,0)"><text x="352" y="88" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Urutan dan kelompok</text><text x="352" y="106" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">penjumlahan boleh diubah.</text><text x="352" y="136" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pasangan satuan:</text><text x="352" y="154" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">8 + 2 = 10, 7 + 3 = 10</text><text x="352" y="178" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">Cari pasangan 1+9, 2+8, 3+7, 4+6, 5+5</text><text x="348" y="214" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Hasil antara jadi bulat:</text><text x="348" y="231" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">tidak ada simpanan berantai.</text></g></svg>