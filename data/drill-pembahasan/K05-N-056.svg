<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan tiga bilangan berurutan berjumlah 114" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">3 bilangan berurutan — jumlah = 3 × tengah</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><rect x="23" y="60" width="46" height="46" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="46" y="90.2" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">37</text><rect x="83" y="60" width="46" height="46" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="106" y="90.2" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">38</text><rect x="143" y="60" width="46" height="46" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="166" y="90.2" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">39</text><rect x="83" y="56" width="46" height="54" rx="6" fill="none" stroke="#111111" stroke-width="2.5"/><text x="46" y="130" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">n − 1</text><text x="106" y="130" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">n</text><text x="166" y="130" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">n + 1</text><text x="100" y="170" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">114 ÷ 3 = 38</text><text x="100" y="192" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">(tengah)</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Jumlah = 3 × n</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">114 ÷ 3 = 38</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Terbesar = n + 1</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">39</text><g transform="translate(8,0)"><text x="352" y="88" font-size="14" font-weight="700" fill="#111111" text-anchor="start">(n − 1) + n + (n + 1) = 3n</text><text x="348" y="116" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">−1 dan +1 saling hapus,</text><text x="348" y="134" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">sisa n + n + n = 3n.</text><text x="348" y="152" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Jadi tengah = jumlah ÷ 3.</text><text x="348" y="188" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Contoh: 37 + 38 + 39</text><text x="348" y="206" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">= 3 × 38 = 114</text></g></svg>