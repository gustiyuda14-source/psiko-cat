<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan lima bilangan ganjil berurutan berjumlah 135" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">5 ganjil berurutan — jumlah = 5 × tengah</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><rect x="8" y="60" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="24" y="81.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">23</text><text x="24" y="112" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">n−4</text><rect x="44" y="60" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="60" y="81.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">25</text><text x="60" y="112" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">n−2</text><rect x="80" y="60" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="96" y="81.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">27</text><text x="96" y="112" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">n</text><rect x="116" y="60" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="132" y="81.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">29</text><text x="132" y="112" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">n+2</text><rect x="152" y="60" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="168" y="81.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">31</text><text x="168" y="112" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">n+4</text><rect x="80" y="56" width="32" height="40" rx="6" fill="none" stroke="#111111" stroke-width="2.5"/><text x="100" y="156" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">135 ÷ 5 = 27</text><text x="100" y="178" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">(tengah)</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Jumlah = 5 × n</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">135 ÷ 5 = 27</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">27 → 29 → 31</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Terbesar = n + 4</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">31</text><g transform="translate(8,0)"><text x="352" y="88" font-size="12" font-weight="700" fill="#111111" text-anchor="start">(n−4)+(n−2)+n+(n+2)+(n+4) = 5n</text><text x="348" y="116" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Selisih ganjil berurutan = 2,</text><text x="348" y="134" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">jadi lompatannya −4, −2, +2, +4.</text><text x="348" y="152" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pasangan −4/+4 dan −2/+2 hilang.</text><text x="348" y="190" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Contoh: 23 + 25 + 27 + 29 + 31</text><text x="348" y="208" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">= 5 × 27 = 135</text></g></svg>