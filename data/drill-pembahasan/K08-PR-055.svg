<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-PR-055" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Rantai himpunan</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="118" cy="142" r="100" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="61" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Jantung beruang</text><text x="118" y="73" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">empat</text><circle cx="118" cy="178" r="64" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="133" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Hewan</text><text x="118" y="145" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">berdarah</text><text x="118" y="157" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">panas</text><circle cx="118" cy="188" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="118" y="210" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Paus</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua hewan berdarah panas</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">memiliki jantung be