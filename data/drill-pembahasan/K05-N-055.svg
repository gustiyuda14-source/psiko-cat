<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan jumlah 1 sampai 30" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">1 + 2 + … + 30 — pasangan ujung</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="26" y="70" font-size="14" font-weight="400" fill="#111111" text-anchor="start">1 + 30 = 31</text><text x="26" y="94" font-size="14" font-weight="400" fill="#111111" text-anchor="start">2 + 29 = 31</text><text x="26" y="118" font-size="14" font-weight="400" fill="#111111" text-anchor="start">3 + 28 = 31</text><text x="26" y="142" font-size="14" font-weight="400" fill="#111111" text-anchor="start">⋮</text><text x="26" y="166" font-size="14" font-weight="400" fill="#111111" text-anchor="start">15 + 16 = 31</text><text x="100" y="212" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">15 × 31</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Pasangkan ujung</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Tiap pasang = 31</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">15 pasang</text><text x="222" y="137" font-size="10" font-weight="400" fill="#555555" text-anchor="start">30 ÷ 2</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">15 × 31</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">465</text><g transform="translate(8,0)"><text x="376" y="86" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">1</text><text x="424" y="86" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">2</text><text x="472" y="86" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">3</text><text x="520" y="86" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">…</text><text x="568" y="86" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">30</text><text x="376" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">30</text><text x="424" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">29</text><text x="472" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">28</text><text x="520" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">…</text><text x="568" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">1</text><line x1="352" y1="124" x2="592" y2="124" stroke="#111111" stroke-width="1.5"/><text x="376" y="146" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">31</text><text x="424" y="146" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">31</text><text x="472" y="146" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">31</text><text x="520" y="146" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">…</text><text x="568" y="146" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">31</text><text x="348" y="184" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Dua barisan dijumlah = 30 × 31.</text><text x="348" y="202" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Itu dua kali jumlah yang dicari,</text><text x="348" y="220" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">jadi bagi 2: 30 × 31 ÷ 2 = 465.</text></g></svg>