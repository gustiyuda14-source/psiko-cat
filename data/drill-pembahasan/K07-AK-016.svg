 y="199" width="100" height="20" rx="0" fill="#fff" stroke="#111111" stroke-width="0"/><text x="16" y="213" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Peta 19</text><text x="258" y="213" font-size="12" font-weight="700" fill="#111111" text-anchor="end">106</text><text x="268" y="213" font-size="13" font-weight="700" fill="#111111" text-anchor="start">✗</text><text x="418" y="213" font-size="12" font-weight="700" fill="#111111" text-anchor="end">28.5</text><text x="428" y="213" font-size="13" font-weight="700" fill="#111111" text-anchor="start">✓</text><text x="8" y="238" font-size="11" font-weight="600" fill="#111111" text-anchor="start">Tiara perlu melepas ≥ 20 menit (125 − 105), Fikri hanya sanggup durasi ≤ 37 ÷ 1,5 ≈ 24,7. Hanya</text><text x="8" y="250.5" font-size="11" font-weight="600" fill="#111111" text-anchor="start">Absensi (24) memenuhi keduanya.</text></svg>