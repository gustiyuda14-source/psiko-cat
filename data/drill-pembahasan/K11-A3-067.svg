><rect x="142" y="161" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="198" y="161" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="254" y="161" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="310" y="161" width="56" height="29" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1"/><circle cx="114" cy="175.5" r="6.5" fill="#111111"/><circle cx="226" cy="175.5" r="6.5" fill="#111111"/><text x="338" y="180.5" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">2</text><text x="78" y="208.5" font-size="12.5" font-weight="400" fill="#111111" text-anchor="end">Bima</text><rect x="86" y="190" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="142" y="190" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="198" y="190" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="254" y="190" width="56" height="29" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><rect x="310" y="190" width="56" height="29" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1"/><circle cx="114" cy="204.5" r="6.5" fill="#111111"/><circle cx="170" cy="204.5" r="6.5" fill="#111111"/><text x="338" y="209.5" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">2</text><line x1="86" y1="223" x2="366" y2="223" stroke="#111111" stroke-width="1"/><text x="338" y="239" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">= 10</text><text x="388" y="74" font-size="13" font-weight="700" fill="#111111" text-anchor="start">①</text><text x="406" y="74" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Sinta hanya melon, jadi 4 anak</text><text x="406" y="88" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">lain (Raka, Laras, Tegar, Bima)</text><text x="406" y="102" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">mengambil stroberi.</text><text x="388" y="126" font-size="13" font-weight="700" fill="#111111" text-anchor="start">②</text><text x="406" y="126" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Cokelat: semua kecuali Sinta</text><text x="406" y="140" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">dan Tegar.</text><text x="388" y="178" font-size="13" font-weight="700" fill="#111111" text-anchor="start">③</text><text x="406" y="178" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Kopi: semua kecuali Sinta,</text><text x="406" y="192" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Raka, dan Bima, yaitu Laras dan</text><text x="406" y="206" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Tegar.</text><text x="388" y="234" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">Jumlah semua permen: 2 + 1 + 3</text><text x="388" y="250" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">+ 2 + 2 = 10.</text></svg>