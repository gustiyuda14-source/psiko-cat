ght="400" fill="#111111" text-anchor="start">12 sama-sama cocok.</text><rect x="16" y="134" width="584" height="24" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="308" y="150.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Jawaban: Opsi E — Hanya pernyataan (1) yang cukup</text></svg>