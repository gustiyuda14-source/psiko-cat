<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 38 kali 15" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">38 × 15 — kali 10 ditambah setengahnya</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="66" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">38 × 15</text><rect x="15" y="80" width="170" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="101" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">38 × 10 = 380</text><text x="100" y="134" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">+</text><rect x="15" y="142" width="170" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="163" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">½ dari 380 = 190</text><line x1="100" y1="176" x2="100" y2="196" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><rect x="15" y="200" width="170" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="221" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">570</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">15 = 10 + 5</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">38 × 10 = 380</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">½ dari 380 = 190</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">380 + 190</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">570</text><g transform="translate(8,0)"><text x="447" y="78" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">10</text><text x="557" y="78" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">5</text><text x="366" y="116" font-size="10" font-weight="400" fill="#555555" text-anchor="end">38</text><rect x="372" y="84" width="150" height="56" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="447" y="117" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">38 × 10</text><rect x="522" y="84" width="70" height="56" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="532" y="104" width="50" height="18" rx="3" fill="#fff" stroke="#111111" stroke-width="1"/><text x="557" y="117" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">38 × 5</text><text x="348" y="166" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">38 × 15 = 38 × 10 + 38 × 5</text><text x="348" y="184" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">38 × 5 = setengah dari 38 × 10</text><text x="348" y="202" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">Jadi ×15 = × 10, lalu tambah</text><text x="348" y="220" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">setengahnya.</text></g></svg>