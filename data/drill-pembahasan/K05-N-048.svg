<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 90 dibagi 1,25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">90 ÷ 1,25 — ambil 80%</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="66" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">90 ÷ 1,25</text><line x1="100" y1="74" x2="100" y2="96" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="90" font-size="11" font-weight="400" fill="#555555" text-anchor="start">× 4/5</text><rect x="25" y="100" width="150" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="121" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">72</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">1,25 = 5/4</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">÷ 5/4 = × 4/5</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">90 ÷ 5 = 18</text><text x="222" y="137" font-size="10" font-weight="400" fill="#555555" text-anchor="start">18 × 4 = 72</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">72</text><g transform="translate(8,0)"><rect x="352" y="84" width="48" height="34" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="376" y="131" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">18</text><rect x="400" y="84" width="48" height="34" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="424" y="131" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">18</text><rect x="448" y="84" width="48" height="34" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="472" y="131" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">18</text><rect x="496" y="84" width="48" height="34" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="520" y="131" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">18</text><rect x="544" y="84" width="48" height="34" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="568" y="131" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">18</text><text x="472" y="152" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">90 = 5 bagian × 18</text><text x="348" y="178" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">÷ 1,25 = ambil 80% (4 dari 5).</text><text x="348" y="196" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">90 ÷ 5 = 18, lalu 4 × 18 = 72</text><text x="348" y="214" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">Sama saja: 