<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 74 kali 66 selisih kuadrat" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">74 × 66 — selisih kuadrat</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><line x1="24" y1="100" x2="184" y2="100" stroke="#111111" stroke-width="2"/><line x1="34" y1="92" x2="34" y2="108" stroke="#111111" stroke-width="2"/><text x="34" y="128" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">66</text><line x1="104" y1="92" x2="104" y2="108" stroke="#111111" stroke-width="2"/><text x="104" y="128" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">70</text><line x1="174" y1="92" x2="174" y2="108" stroke="#111111" stroke-width="2"/><text x="174" y="128" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">74</text><path d="M38 86 Q 70 62 100 86" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><path d="M108 86 Q 140 62 170 86" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="69" y="68" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">4</text><text x="139" y="68" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">4</text><text x="104" y="170" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">70² − 4²</text><text x="104" y="196" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">= 4.900 − 16</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Tengah 70, jarak 4</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">70² = 4.900</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">4² = 16</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">4.900 − 16</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4.884</text><g transform="translate(8,0)"><path d="M352 72 h100 v72 h-28 v28 h-72 z" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="424" y="144" width="28" height="28" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><text x="388" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">70²</text><text x="438" y="184" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">4² dibuang</text><text x="472" y="88" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Sisa bentuk L =</text><text x="472" y="107" font-size="12" font-weight="400" fill="#111111" text-anchor="start">70² − 4²</text><text x="472" y="126" font-size="12" font-weight="400" fill="#111111" text-anchor="start">potong &amp; tempel</text><text x="472" y="145" font-size="12" font-weight="400" fill="#111111" text-anchor="start">jadi persegi panjang</text><text x="472" y="164" font-size="12" font-weight="700" fill="#111111" text-anchor="start">74 × 66</text><text x="348" y="208" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">(a + b)(a − b) = a² − b²</text><text x="348" y="225" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">a = 70 (tengah), b = 4 (jarak)</text></g></svg>