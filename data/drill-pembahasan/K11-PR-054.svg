<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K11-PR-054" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="700" fill="#111111" text-anchor="start">Jadwal libur sebelum dan sesudah bertukar</text><text x="16" y="44" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Bima dan Citra bertukar; jadwal Dodi tidak berubah</text><text x="190" y="72" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Semula</text><text x="330" y="72" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Minggu ini</text><text x="110" y="110" font-size="14" font-weight="700" fill="#111111" text-anchor="end">Bima</text><rect x="140" y="86" width="100" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="190" y="106.68" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Senin</text><line x1="246" y1="102" x2="278" y2="102" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><rect x="284" y="86" width="100" height="32" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="334" y="106.68" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Kamis</text><text x="110" y="154" font-size="14" font-weight="700" fill="#111111" text-anchor="end">Citra</text><rect x="140" y="130" width="100" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="190" y="150.68" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Kamis</text><line x1="246" y1="146" x2="278" y2="146" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><rect x="284" y="130" width="100" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="334" y="150.68" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Senin</text><text x="110" y="198" font-size="14" font-weight="700" fill="#111111" text-anchor="end">Dodi</text><rect x="140" y="174" width="100" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="190" y="194.68" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Kamis</text><line x1="246" y1="190" x2="278" y2="190" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><rect x="284" y="174" width="100" height="32" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="334" y="194.68" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Kamis</text><text x="430" y="104" font-size="13" font-weight="400" fill="#111111" text-anchor="start">Setelah bertukar: Bima</text><text x="430" y="121" font-size="13" font-weight="400" fill="#111111" text-anchor="start">libur Kamis, Citra libur</text><text x="430" y="138" font-size="13" font-weight="400" fill="#111111" text-anchor="start">Senin, Dodi tetap Kamis.</text><text x="430" y="172" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Bima dan Dodi libur pada</text><text x="430" y="189" font-size="13" font-weight="700" fill="#111111" text-anchor="start">hari yang sama (Kamis).</text></svg>