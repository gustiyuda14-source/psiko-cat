<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan jumlah deret beda tetap" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">18 + 22 + 26 + 30 + 34 — suku tengah</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><rect x="8" y="96" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="24" y="117.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">18</text><rect x="44" y="96" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="60" y="117.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">22</text><rect x="80" y="96" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="96" y="117.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">26</text><rect x="116" y="96" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="132" y="117.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">30</text><rect x="152" y="96" width="32" height="32" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="168" y="117.04" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">34</text><rect x="80" y="92" width="32" height="40" rx="6" fill="none" stroke="#111111" stroke-width="2.5"/><path d="M24 90 Q 96 40 168 90" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="96" y="56" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">18 + 34 = 52 = 2 × 26</text><path d="M60 136 Q 96 164 132 136" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="96" y="170" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">22 + 30 = 52</text><text x="100" y="212" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">5 × 26</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Suku tengah: 26</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Ujung = 2 × 26</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">5 suku × 26</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">130</text><g transform="translate(8,0)"><text x="348" y="90" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Barisan selisih tetap (4):</text><text x="348" y="108" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">18 + 34 = 22 + 30 = 26 + 26</text><text x="348" y="126" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Tiap pasangan ujung = 2 × tengah.</text><text x="348" y="160" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">Jumlah = banyak suku × tengah</text><text x="348" y="190" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Berlaku bila banyak suku ganjil;</text><text x="348" y="208" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">genap: rata-rata dua suku tengah.</text></g></svg>