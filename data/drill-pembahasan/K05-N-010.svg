<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan naik 20 persen lalu turun 20 persen" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Naik 20% lalu turun 20%</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><rect x="40" y="50" width="120" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="71" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">50.000</text><line x1="100" y1="82" x2="100" y2="104" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="98" font-size="10" font-weight="400" fill="#555555" text-anchor="start">× 1,2  (naik 20%)</text><rect x="40" y="108" width="120" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="129" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">60.000</text><line x1="100" y1="140" x2="100" y2="162" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="156" font-size="10" font-weight="400" fill="#555555" text-anchor="start">× 0,8  (turun 20%)</text><rect x="40" y="166" width="120" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="187" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">48.000</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Naik = × 1,2</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Turun = × 0,8</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">1,2 × 0,8 = 0,96</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Turun 4%</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Rp48.000</text><g transform="translate(8,0)"><rect x="352" y="74" width="100" height="80" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="452" y="74" width="20" height="80" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="352" y="154" width="100" height="20" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="452" y="154" width="20" height="20" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="402" y="118" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">1 × 0,8</text><text x="462" y="70" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">+0,2</text><text x="402" y="187" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">−0,2 (dibuang)</text><text x="486" y="88" font-size="12" font-weight="400" fill="#111111" text-anchor="start">kotak 1,2 × 0,8</text><text x="486" y="108" font-size="12" font-weight="400" fill="#111111" text-anchor="start">= 1 − 0,2²</text><text x="486" y="128" font-size="12" font-weight="400" fill="#111111" text-anchor="start">= 1 − 0,04</text><text x="486" y="148" font-size="12" font-weight="700" fill="#111111" text-anchor="start">= 0,96</text><text x="348" y="222" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Naik p% lalu turun p%: selalu</text><text x="348" y="239" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">turun p² (tidak pernah impas).</text></g></svg>