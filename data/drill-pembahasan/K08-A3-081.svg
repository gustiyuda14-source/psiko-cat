<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-A3-081" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Napas panjang belum tentu perenang andal</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="118" cy="142" r="100" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="61" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Napas panjang</text><circle cx="118" cy="178" r="64" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="133" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Perenang</text><text x="118" y="145" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">andal</text><circle cx="118" cy="186" r="9" fill="#fff" stroke="#111111" stroke-width="2" stroke-dasharray="3 2"/><circle cx="132" cy="176" r="8" fill="#111111"/><text x="132" y="180" font-size="8.8" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="204" cy="172" r="9" fill="#fff" stroke="#111111" stroke-width="2" stroke-dasharray="3 2"/><circle cx="218" cy="162" r="8" fill="#111111"/><text x="218" y="166" font-size="8.8" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="232" y="92" font-size="10.5" font-weight="400" fill="#111111" text-anchor="start">Laras tidak pasti: ① di</text><text x="232" y="104.5" font-size="10.5" font-weight="400" fill="#111111" text-anchor="start">dalam Perenang andal → ya;</text><text x="232" y="117" font-size="10.5" font-weight="400" fill="#111111" text-anchor="start">② di luar → bukan, tetapi</text><text x="232" y="129.5" font-size="10.5" font-weight="400" fill="#111111" text-anchor="start">tetap Napas panjang.</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua perenang andal memiliki</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">napas yang panjang.</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Laras memiliki napas yang</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">panjang.</text><text x="398" y="114" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="130" font-size="12" font-weight="700" fill="#111111" text-anchor="start">E. Laras belum tentu perenang</text><text x="398" y="144.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">andal.</text></svg>