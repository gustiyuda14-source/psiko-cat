<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-B3-082" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Garis hari dalam seminggu</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><rect x="8" y="110" width="48" height="46" rx="5" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="32" y="138" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Senin</text><rect x="59" y="110" width="48" height="46" rx="5" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="83" y="138" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Selasa</text><rect x="110" y="110" width="48" height="46" rx="5" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="134" y="138" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Rabu</text><rect x="161" y="110" width="48" height="46" rx="5" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="185" y="138" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Kamis</text><rect x="212" y="110" width="48" height="46" rx="5" fill="url(#hatch)" stroke="#111111" stroke-width="3"/><text x="236" y="138" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Jumat</text><rect x="263" y="110" width="48" height="46" rx="5" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="287" y="138" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Sabtu</text><rect x="314" y="110" width="48" height="46" rx="5" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="338" y="138" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Minggu</text><text x="32" y="102" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">kemarin</text><text x="83" y="102" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">hari ini</text><text x="236" y="102" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">batik</text><path d="M83 162 Q 159.5 210 236 162" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><text x="159.5" y="206" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">3 hari lagi</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua satpam memakai seragam</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">batik pada hari Jumat.</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Kemarin hari Senin.</text><text x="398" y="94.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Dodi adalah seorang satpam.</text><text x="398" y="119" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="135" font-size="12" font-weight="700" fill="#111111" text-anchor="start">D. Tiga hari lagi Dodi memakai</text><text x="398" y="149.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">seragam batik.</text></svg>