<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-PR-057" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Dua keadaan yang sama-sama sesuai premis</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><text x="94" y="44" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Keadaan 1</text><circle cx="94" cy="128" r="76" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="68" cy="144" r="32" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="116" cy="144" r="32" fill="url(#hatch)" fill-opacity="0.35" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 3"/><text x="94" y="71" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Hadir di balai</text><text x="94" y="83" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">desa</text><text x="68" y="148" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Warga</text><text x="116" y="189" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Pengurus</text><text x="94" y="240" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">⇒ pengurus ada yang warga</text><text x="284" y="44" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Keadaan 2</text><circle cx="284" cy="128" r="76" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="248" cy="148" r="26" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="322" cy="148" r="26" fill="url(#hatch)" fill-opacity="0.35" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 3"/><text x="284" y="71" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Hadir di balai</text><text x="284" y="83" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">desa</text><text x="248" y="152" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Warga</text><text x="322" y="187" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Pengurus</text><text x="284" y="240" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">⇒ pengurus bukan warga</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Beberapa warga hadir di balai</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">desa.</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua pengurus karang taruna</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">hadir di balai desa.</text><text x="398" y="114" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="130" font-size="12" font-weight="700" fill="#111111" text-anchor="start">E. Tidak dapat disimpulkan</text><text x="398" y="144.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">hubungan antara warga dan</text><text x="398" y="159" font-size="12" font-weight="700" fill="#111111" text-anchor="start">pengurus karang taruna.</text></svg>