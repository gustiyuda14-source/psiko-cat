<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan naik 10 persen dua tahun" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Naik 10% dua kali — bunga atas bunga</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="66" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">Gaji 100</text><line x1="100" y1="74" x2="100" y2="96" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="90" font-size="11" font-weight="400" fill="#555555" text-anchor="start">+ 10%</text><rect x="25" y="100" width="150" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="121" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">110</text><line x1="100" y1="134" x2="100" y2="158" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="151" font-size="11" font-weight="400" fill="#555555" text-anchor="start">+ 10%</text><rect x="25" y="162" width="150" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="183" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">121</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Naik 10%: × 1,1</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">1,1 × 1,1 = 1,21</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Naik 21%</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">21%</text><g transform="translate(8,0)"><rect x="352" y="76" width="100" height="100" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="402" y="131" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">1 × 1</text><rect x="452" y="76" width="14" height="100" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="352" y="176" width="100" height="14" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="452" y="176" width="14" height="14" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="459" y="71" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">0,1</text><text x="348" y="186" font-size="10" font-weight="400" fill="#555555" text-anchor="end">0,1</text><text x="486" y="92" font-size="12" font-weight="400" fill="#111111" text-anchor="start">(1 + 0,1)²</text><text x="486" y="111" font-size="12" font-weight="400" fill="#111111" text-anchor="start">= 1 + 0,1 + 0,1</text><text x="486" y="130" font-size="12" font-weight="400" fill="#111111" text-anchor="start">+ 0,01 (pojok)</text><text x="486" y="149" font-size="12" font-weight="700" fill="#111111" text-anchor="start">= 1,21</text><text x="348" y="222" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pojok 0,01 = bunga atas bunga:</text><text x="348" y="239" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">itu sebabnya total bukan 20%.</text></g></svg>