<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-A3-085" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Diagram himpunan</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="118" cy="142" r="100" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="61" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Suka ikan</text><circle cx="118" cy="178" r="64" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="133" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Kucing di</text><text x="118" y="145" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">rumah</text><circle cx="206" cy="182" r="78" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><text x="225.8" y="274" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Bertubuh gemuk</text><clipPath id="lens"><circle cx="118" cy="178" r="64"/></clipPath><circle cx="206" cy="182" r="66" fill="url(#hatch)" clip-path="url(#lens)" stroke="none"/><circle cx="206" cy="182" r="66" fill="none" stroke="#111111" stroke-width="2"/><rect x="146" y="175" width="38" height="22" rx="11" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="165" y="189.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">ada</text><text x="278" y="178" font-size="11" font-weight="700" fill="#111111" text-anchor="start">Suka susu</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua kucing di rumah itu suka</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">ikan.</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Sebagian kucing di rumah itu suka</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">susu.</text><text x="398" y="108" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua yang suka susu bertubuh</text><text x="398" y="121.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">gemuk.</text><text x="398" y="146" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="162" font-size="12" font-weight="700" fill="#111111" text-anchor="start">D. Sebagian kucing di rumah itu</text><text x="398" y="176.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">yang suka ikan bertubuh gemuk.</text></svg>