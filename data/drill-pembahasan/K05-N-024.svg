<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 278 kali 11" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">278 × 11 — kali 11</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="44" y="92" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">2</text><text x="84" y="92" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">7</text><text x="124" y="92" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">8</text><text x="164" y="92" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">0</text><text x="20" y="122" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">+</text><text x="44" y="122" font-size="22" font-weight="700" fill="#111111" text-anchor="middle"></text><text x="84" y="122" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">2</text><text x="124" y="122" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">7</text><text x="164" y="122" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">8</text><line x1="22" y1="134" x2="186" y2="134" stroke="#111111" stroke-width="2"/><text x="44" y="166" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">3</text><text x="84" y="166" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">0</text><text x="124" y="166" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">5</text><text x="164" y="166" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">8</text><text x="44" y="70" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">1</text><text x="84" y="70" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">1</text><text x="100" y="198" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">angka kecil = simpanan</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Satuan: 8</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">8 + 7 = 15</text><text x="222" y="107" font-size="10" font-weight="400" fill="#555555" text-anchor="start">tulis 5, simpan 1</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">7 + 2 + 1 = 10</text><text x="222" y="137" font-size="10" font-weight="400" fill="#555555" text-anchor="start">tulis 0, simpan 1</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">2 + 1 = 3</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3.058</text><g transform="translate(8,0)"><text x="352" y="92" font-size="13" font-weight="700" fill="#111111" text-anchor="start">278 × 11 = 278 × 10 + 278</text><text x="348" y="122" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Jumlahkan 2.780 dan 278 kolom demi</text><text x="348" y="140" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">kolom: tiap kolom = dua digit yang</text><text x="348" y="158" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">bertetangga (8 + 7, 7 + 2, …).</text><text x="348" y="176" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">Itu sebabnya aturannya</text><text x="348" y="194" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">'jumlahkan tetangga'.</text></g></svg>