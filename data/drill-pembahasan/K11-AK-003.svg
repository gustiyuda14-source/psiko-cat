<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K11-AK-003" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="700" fill="#111111" text-anchor="start">Dua petugas, lima tugas</text><text x="16" y="44" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Dina 13.00–14.00 · Eko 13.10–14.10 · tiap tugas tidak dipotong</text><text x="8" y="99" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">Dina</text><rect x="64" y="80" width="100.80000000000001" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="114.4" y="99" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Daftar 14</text><rect x="164.8" y="80" width="187.2" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="258.4" y="99" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Pengeras suara 26</text><rect x="352" y="80" width="144" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="3"/><text x="424" y="99" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Kursi 20</text><text x="8" y="143" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">Eko</text><rect x="136" y="124" width="216" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="244" y="143" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Tenda 30</text><rect x="352" y="124" width="172.79999999999995" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="438.4" y="143" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Spanduk 24</text><line x1="64" y1="168" x2="568" y2="168" stroke="#111111" stroke-width="1"/><line x1="64" y1="165" x2="64" y2="171" stroke="#111111" stroke-width="1"/><text x="64" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">13.00</text><line x1="136" y1="165" x2="136" y2="171" stroke="#111111" stroke-width="1"/><text x="136" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">13.10</text><line x1="208" y1="165" x2="208" y2="171" stroke="#111111" stroke-width="1"/><text x="208" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">13.20</text><line x1="280" y1="165" x2="280" y2="171" stroke="#111111" stroke-width="1"/><text x="280" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">13.30</text><line x1="352" y1="165" x2="352" y2="171" stroke="#111111" stroke-width="1"/><text x="352" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">13.40</text><line x1="424" y1="165" x2="424" y2="171" stroke="#111111" stroke-width="1"/><text x="424" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">13.50</text><line x1="496" y1="165" x2="496" y2="171" stroke="#111111" stroke-width="1"/><text x="496" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">14.00</text><line x1="568" y1="165" x2="568" y2="171" stroke="#111111" stroke-width="1"/><text x="568" y="183" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">14.10</text><line x1="208" y1="64" x2="208" y2="78" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="208" y="60" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">daftar hadir selesai ≤ 13.20</text><text x="16" y="198" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Daftar hadir (14 menit, selesai ≤ 13.20) harus dimulai ≤ 13.06 sebelum Eko datang: tugas</text><text x="16" y="213" font-size="12" font-weight="400" fill="#111111" text-anchor="start">pertama Dina. Tenda ke Dina berarti 14 + 30 + 24 = 68 > 60 menit, jadi tenda dikerjakan</text><text x="16" y="228" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Eko 13.10–13.40. Kursi tidak muat di Eko (74 > 60), jadi Dina menata kursi 13.40–14.00.</text></svg>