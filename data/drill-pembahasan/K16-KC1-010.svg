<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K16-KC1-010" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="24" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">Yang ditanya:</text><text x="106" y="24" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Apakah pendapatan N lebih besar dari M (Rp600.000)?</text><rect x="16" y="42" width="84" height="44" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="68" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(1) saja</text><rect x="108" y="51" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="67.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="60.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Harga N 18.000: terjual 40 → 720.000 (ya), terjual 30 →</text><text x="232" y="75.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">540.000 (tidak).</text><rect x="16" y="92" width="84" height="44" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="118" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(2) saja</text><rect x="108" y="101" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="117.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="110.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Terjual 32: harga 20.000 → 640.000 (ya), harga 15.000 →</text><text x="232" y="125.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">480.000 (tidak).</text><rect x="16" y="142" width="84" height="34" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="163" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(1) + (2)</text><rect x="108" y="146" width="112" height="26" rx="13" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="164" y="162.96" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">CUKUP ✓</text><text x="232" y="163" font-size="12" font-weight="400" fill="#111111" text-anchor="start">18.000 × 32 = 576.000 &lt; 600.000: pasti "tidak".</text><rect x="16" y="184" width="584" height="24" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="308" y="200.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Jawaban: Opsi C — Cukup hanya jika (1) dan (2) digabung</text></svg>