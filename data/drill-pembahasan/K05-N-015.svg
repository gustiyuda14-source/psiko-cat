<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan cek angka satuan 387 kali 46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">387 × 46 — cek angka satuan</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="68" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">387 × 46</text><text x="100" y="88" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">satuan: 7 × 6 = 42 → 2</text><text x="110" y="108" font-size="15" font-weight="600" fill="#555555" text-anchor="end">17.80</text><text x="118" y="108" font-size="15" font-weight="700" fill="#555555" text-anchor="middle">0</text><line x1="60" y1="103" x2="140" y2="103" stroke="#111111" stroke-width="1"/><text x="110" y="130" font-size="15" font-weight="600" fill="#111111" text-anchor="end">17.80</text><text x="118" y="130" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">2</text><rect x="108" y="115" width="20" height="20" rx="4" fill="none" stroke="#111111" stroke-width="2"/><text x="110" y="152" font-size="15" font-weight="600" fill="#555555" text-anchor="end">17.80</text><text x="118" y="152" font-size="15" font-weight="700" fill="#555555" text-anchor="middle">4</text><line x1="60" y1="147" x2="140" y2="147" stroke="#111111" stroke-width="1"/><text x="110" y="174" font-size="15" font-weight="600" fill="#555555" text-anchor="end">17.80</text><text x="118" y="174" font-size="15" font-weight="700" fill="#555555" text-anchor="middle">6</text><line x1="60" y1="169" x2="140" y2="169" stroke="#111111" stroke-width="1"/><text x="110" y="196" font-size="15" font-weight="600" fill="#555555" text-anchor="end">17.80</text><text x="118" y="196" font-size="15" font-weight="700" fill="#555555" text-anchor="middle">8</text><line x1="60" y1="191" x2="140" y2="191" stroke="#111111" stroke-width="1"/><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Cek opsi: beda</text><text x="222" y="77" font-size="10" font-weight="400" fill="#555555" text-anchor="start">hanya di angka satuan</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">7 × 6 = 42</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Satuan = 2</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Pilih yang ber-2</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">17.802</text><g transform="translate(8,0)"><text x="414" y="68" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">40</text><text x="488" y="68" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">6</text><text x="364" y="92" font-size="10" font-weight="400" fill="#555555" text-anchor="end">380</text><text x="364" y="124" font-size="10" font-weight="400" fill="#555555" text-anchor="end">7</text><rect x="368" y="72" width="92" height="34" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="414" y="88" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">380 × 40</text><text x="414" y="101" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">…0</text><rect x="460" y="72" width="56" height="34" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="488" y="88" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">380 × 6</text><text x="488" y="101" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">…0</text><rect x="368" y="106" width="92" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="414" y="120" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">7 × 40</text><text x="414" y="133" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">…0</text><rect x="460" y="106" width="56" height="30" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="488" y="120" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">7 × 6</text><text x="488" y="133" font-size="10" font-weight="400" fill="#fff" text-anchor="middle">…2</text><text x="524" y="90" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Tiga kotak</text><text x="524" y="108" font-size="12" font-weight="400" fill="#111111" text-anchor="start">berakhiran 0.</text><text x="524" y="126" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Satuan hanya</text><text x="524" y="144" font-size="12" font-weight="700" fill="#111111" text-anchor="start">dari 7 × 6.</text><text x="348" y="172" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Lihat opsi dulu sebelum menghitung.</text><text x="348" y="190" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Kalau opsi hanya beda di satuan,</text><text x="348" y="208" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">cukup kalikan satuannya.</text></g></svg>