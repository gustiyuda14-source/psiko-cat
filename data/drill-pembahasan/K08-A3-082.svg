<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-A3-082" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Dua keadaan yang sama-sama sesuai premis</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><text x="94" y="44" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Keadaan 1</text><circle cx="94" cy="120" r="70" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="74" cy="128" r="30" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="134" cy="140" r="46" fill="url(#hatch)" fill-opacity="0.35" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 3"/><text x="94" y="69" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Minuman pahit</text><text x="74" y="132" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Kopi</text><text x="134" y="199" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Bergula</text><text x="94" y="240" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">⇒ kopi ada yang bergula</text><text x="284" y="44" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Keadaan 2</text><circle cx="284" cy="120" r="70" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="256" cy="114" r="30" fill="#fff" fill-opacity="0" stroke="#111111" stroke-width="1.6"/><circle cx="334" cy="150" r="40" fill="url(#hatch)" fill-opacity="0.35" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 3"/><text x="284" y="69" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Minuman pahit</text><text x="256" y="118" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Kopi</text><text x="334" y="203" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Bergula</text><text x="284" y="240" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">⇒ kopi tidak bergula</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua kopi di kedai itu terasa</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">pahit.</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Sebagian minuman yang terasa</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">pahit mengandung gula.</text><text x="398" y="114" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="130" font-size="12" font-weight="700" fill="#111111" text-anchor="start">B. Tidak dapat disimpulkan</text></svg>