11" text-anchor="start">50% dari 28</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">50% = ½</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">28 ÷ 2</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">14</text><g transform="translate(8,0)"><text x="410" y="96" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">28 × 50</text><line x1="372.4" y1="103" x2="447.6" y2="103" stroke="#111111" stroke-width="1.5"/><text x="410" y="122" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">100</text><text x="470" y="114" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">=</text><text x="530" y="96" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">50 × 28</text><line x1="492.4" y1="103" x2="567.6" y2="103" stroke="#111111" stroke-width="1.5"/><text x="530" y="122" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">100</text><text x="348" y="172" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pembilangnya sama: 28 × 50.</text><text x="348" y="190" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Urutan kali boleh ditukar.</text><text x="348" y="208" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">Pilih sisi yang persennya enak</text><text x="348" y="226" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">(10%, 20%, 25%, 50%).</text></g></svg>