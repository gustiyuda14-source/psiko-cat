<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K11-PR-064" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="700" fill="#111111" text-anchor="start">Urutan tinggi pohon</text><text x="16" y="44" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Jambu air &lt; kelapa gading ≤ jenis kelapa lainnya</text><rect x="40" y="144" width="66" height="70" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="73" y="232" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Jambu air</text><rect x="138" y="109" width="66" height="105" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="171" y="232" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Kelapa gading</text><text x="122" y="192" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">&lt;</text><rect x="236" y="74" width="66" height="140" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="269" y="232" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Kelapa hijau</text><text x="220" y="192" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">≤</text><rect x="334" y="54" width="66" height="160" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="367" y="232" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Kelapa sawit</text><text x="318" y="192" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">≤</text><text x="446" y="84" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Kelapa gading paling</text><text x="446" y="100" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">rendah di antara</text><text x="446" y="116" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">kelapa, jadi kelapa</text><text x="446" y="132" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">hijau dan sawit minimal</text><text x="446" y="148" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">sama tinggi dengan</text><text x="446" y="164" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">gading. Jambu air masih</text><text x="446" y="180" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">di bawah gading, jadi</text><text x="446" y="196" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">kelapa hijau lebih</text><text x="446" y="212" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">tinggi dari jambu air.</text></svg>