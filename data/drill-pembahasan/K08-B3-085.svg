<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-B3-085" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Yang diketahui hanya dua orang</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="110" cy="148" r="88" fill="#fff" stroke="#111111" stroke-width="2"/><text x="110" y="86" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Semua sahabat</text><text x="110" y="100" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">(tidak diketahui)</text><circle cx="110" cy="160" r="40" fill="url(#hatch)" fill-opacity="0.5" stroke="#111111" stroke-width="2.5"/><rect x="80" y="142" width="60" height="36" rx="6" fill="#fff" stroke="#111111" stroke-width="0"/><text x="110" y="157" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Dinda</text><text x="110" y="172" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">dan Raka</text><line x1="154" y1="160" x2="210" y2="160" stroke="#111111" stroke-width="1.2" marker-end="url(#ah)"/><text x="216" y="148" font-size="11" font-weight="400" fill="#111111" text-anchor="start">hanya mereka berdua yang</text><text x="216" y="161" font-size="11" font-weight="400" fill="#111111" text-anchor="start">diketahui berlari bersama</text><text x="216" y="174" font-size="11" font-weight="400" fill="#111111" text-anchor="start">tiap Sabtu pagi.</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Dinda dan Raka adalah sahabat.</text><text x="398" y="62.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Setiap Sabtu pagi mereka berlari</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">bersama.</text><text x="398" y="100.5" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="116.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">C. Tidak dapat disimpulkan</text></svg>