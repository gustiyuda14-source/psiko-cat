<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 345 dibagi 5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">345 ÷ 5 — kali 2, bagi 10</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="74" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">345 ÷ 5</text><text x="30" y="104" font-size="11" font-weight="400" fill="#555555" text-anchor="start">× 2</text><text x="100" y="104" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">690</text><text x="30" y="132" font-size="11" font-weight="400" fill="#555555" text-anchor="start">÷ 10</text><text x="100" y="132" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">69</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">5 = 10 ÷ 2</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">345 × 2 = 690</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">690 ÷ 10</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">69</text><g transform="translate(8,0)"><text x="420" y="96" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">345</text><line x1="399.8" y1="103" x2="440.2" y2="103" stroke="#111111" stroke-width="1.5"/><text x="420" y="124" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">5</text><text x="466" y="114" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">=</text><text x="536" y="96" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">345 × 2</text><line x1="500.5" y1="103" x2="571.5" y2="103" stroke="#111111" stroke-width="1.5"/><text x="536" y="121" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">5 × 2</text><text x="348" y="172" font-size="12" font-weight="400" fill="#111111" text-anchor="start">5 × 2 = 10, jadi penyebut</text><text x="348" y="190" font-size="12" font-weight="400" fill="#111111" text-anchor="start">berubah menjadi angka bulat</text><text x="348" y="208" font-size="12" font-weight="400" fill="#111111" text-anchor="start">dan membagi cukup geser koma.</text><text x="348" y="226" font-size="12" font-weight="600" fill="#111111" text-anchor="start">Kali 2 = gandakan 1 kali.</text></g></svg>