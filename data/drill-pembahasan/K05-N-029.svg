<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 52 kuadrat" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">52² — dekat 50</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="64" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">52 = 50 + 2</text><rect x="20" y="84" width="160" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="105" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">50² = 2.500</text><rect x="20" y="126" width="160" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="147" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">+ 200 (dua pita)</text><rect x="20" y="168" width="160" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="189" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">+ 4 (pojok)</text><text x="100" y="222" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">2.500 + 200 + 4</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">52 = 50 + 2</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">50² = 2.500</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">2 × 50 × 2 = 200</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">2² = 4</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2.704</text><g transform="translate(8,0)"><rect x="352" y="76" width="90" height="90" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="397" y="126" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">50 × 50</text><rect x="442" y="76" width="18" height="90" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="352" y="166" width="90" height="18" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="442" y="166" width="18" height="18" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="451" y="178" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="460" y="76" width="18" height="90" rx="0" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><text x="469" y="71" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">ke sini</text><path d="M397 186 Q 494 198 469 133" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="486" y="92" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">52² = 50² + dua pita</text><text x="486" y="109" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">50 × 2 + pojok 2 × 2</text><text x="348" y="208" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Dua pita: 2 × 50 × 2 = 200</text><text x="348" y="225" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pojok: 2 × 2 = 4</text><text x="348" y="242" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">2.500 + 200 + 4 = 2.704</text></g></svg>