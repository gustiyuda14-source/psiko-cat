<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-B2-088" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Rantai himpunan</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="118" cy="142" r="100" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="61" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Membutuhkan</text><text x="118" y="73" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">oksigen</text><circle cx="118" cy="166" r="76" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="109" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Hewan</text><circle cx="118" cy="190" r="52" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="157" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Burung</text><circle cx="118" cy="200" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="118" y="222" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Merpati</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua burung adalah hewan.</text><text x="398" y="62.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua hewan membutuhkan oksigen.</text><text x="398" y="81" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Merpati adalah burung yang dapat</text><text x="398" y="94.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">terbang.</text><text x="398" y="113" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Tidak semua burung dapat</text><text x="398" y="126.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">menyelam.</text><text x="398" y="151" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="167" font-size="12" font-weight="700" fill="#111111" text-anchor="start">D. Merpati membutuhkan oksigen.</text></svg>