<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-A3-084" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Diagram himpunan</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="118" cy="142" r="100" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="61" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Dari hutan tanaman</text><circle cx="118" cy="166" r="76" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="109" font-size="10.5" font-weight="700" fill="#111111" text-anchor="middle">Jati</text><circle cx="118" cy="190" r="52" fill="#fff" stroke="#111111" stroke-width="2"/><text x="118" y="157" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Meja di</text><text x="118" y="169" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">toko</text><clipPath id="lens"><circle cx="118" cy="190" r="52"/></clipPath><circle cx="194" cy="194" r="54" fill="url(#hatch)" clip-path="url(#lens)" stroke="none"/><circle cx="194" cy="194" r="54" fill="none" stroke="#111111" stroke-width="2"/><rect x="140" y="187" width="38" height="22" rx="11" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="159" y="201.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">ada</text><text x="254" y="190" font-size="11" font-weight="700" fill="#111111" text-anchor="start">Berwarna cokelat</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua meja di toko itu terbuat</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">dari jati.</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua jati di toko itu berasal</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">dari hutan tanaman.</text><text x="398" y="108" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Sebagian meja di toko itu</text><text x="398" y="121.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">berwarna cokelat.</text><text x="398" y="146" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="162" font-size="12" font-weight="700" fill="#111111" text-anchor="start">C. Sebagian barang berwarna</text><text x="398" y="176.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">cokelat di toko itu berasal dari</text><text x="398" y="191" font-size="12" font-weight="700" fill="#111111" text-anchor="start">hutan tanaman.</text></svg>