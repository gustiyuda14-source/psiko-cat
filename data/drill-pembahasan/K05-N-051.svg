<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 356 tambah 198 kompensasi" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">356 + 198 — kompensasi</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><line x1="20" y1="120" x2="186" y2="120" stroke="#111111" stroke-width="2"/><line x1="30" y1="112" x2="30" y2="128" stroke="#111111" stroke-width="2"/><text x="30" y="146" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">356</text><line x1="150" y1="112" x2="150" y2="128" stroke="#111111" stroke-width="2"/><text x="150" y="146" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">556</text><line x1="170" y1="112" x2="170" y2="128" stroke="#111111" stroke-width="2"/><text x="170" y="164" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">554</text><path d="M34 108 Q 90 56 146 108" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="90" y="70" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+ 200</text><path d="M150 104 Q 160 92 168 106" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="160" y="88" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">− 2</text><text x="100" y="200" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">356 + 200 − 2</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">198 = 200 − 2</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">356 + 200 = 556</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">556 − 2</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">554</text><g transform="translate(8,0)"><text x="352" y="92" font-size="16" font-weight="700" fill="#111111" text-anchor="start">a + 198</text><text x="352" y="118" font-size="16" font-weight="700" fill="#111111" text-anchor="start">= a + (200 − 2)</text><text x="352" y="144" font-size="16" font-weight="700" fill="#111111" text-anchor="start">= (a + 200) − 2</text><text x="348" y="184" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Tambah ratusan bulat tanpa simpan,</text><text x="348" y="202" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">lalu satu koreksi kecil.</text><text x="348" y="220" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">+ 99 = + 100 − 1</text><text x="348" y="238" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">+ 998 = + 1.000 − 2</text></g></svg>