<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K10-B3-080" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="24" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Gambar soal</text><rect x="10" y="34" width="344" height="160" rx="6" fill="#fff" stroke="#bbbbbb" stroke-width="1"/><g transform="translate(14,64.74918566775244) scale(0.5472312703583062)"><g fill="none" stroke="#16224a" stroke-width="3" stroke-linejoin="round"><g class="shapes"><g transform="translate(20,0)"><rect x="10" y="20" width="140" height="70"/><rect x="10" y="90" width="140" height="70"/><path d="M150 20 L220 90 L150 160"/><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="80" y="55" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="central">530</text><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="80" y="125" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="central">386</text><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="176" y="90" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central">12</text></g><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="307.0" y="90.0" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">=</text><g transform="translate(362,0)"><rect x="10" y="20" width="140" height="70"/><rect x="10" y="90" width="140" height="70"/><path d="M150 20 L220 90 L150 160"/><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="80" y="55" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="central">610</text><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="80" y="125" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="central">441</text><text fill="#16224a" stroke="none" font-family="Arial, Helvetica, sans-serif" x="176" y="90" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central">?</text></g></g></g></g><text x="372" y="24" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Aturan</text><text x="372" y="44" font-size="13.5" font-weight="700" fill="#111111" text-anchor="start">Selisih dua kotak = kuadrat</text><text x="372" y="61" font-size="13.5" font-weight="700" fill="#111111" text-anchor="start">angka di ujung panah</text><text x="372" y="92" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Gambar 1 (cocok)</text><line x1="372" y1="97" x2="604" y2="97" stroke="#bbbbbb" stroke-width="0.8"/><text x="372" y="116" font-size="14" font-weight="600" fill="#111111" text-anchor="start">530 − 386 = 144 = 12²</text><text x="594" y="116" font-size="14" font-weight="700" fill="#111111" text-anchor="start">✓</text><text x="372" y="147" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Gambar 2</text><line x1="372" y1="152" x2="604" y2="152" stroke="#bbbbbb" stroke-width="0.8"/><text x="372" y="171" font-size="14" font-weight="600" fill="#111111" text-anchor="start">610 − 441 = 169</text><text x="372" y="192" font-size="14" font-weight="600" fill="#111111" text-anchor="start">169 = ?² → ? = 13</text><rect x="10" y="208" width="150" height="40" rx="8" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="85" y="235.2" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">? = 13</text></svg>