<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-PR-061" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Bagan aturan latihan renang</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><rect x="104" y="44" width="176" height="40" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="192" y="68.32" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Ada ujian di sekolah?</text><line x1="150" y1="86" x2="74" y2="126" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><line x1="234" y1="86" x2="310" y2="126" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><text x="84" y="106" font-size="10.5" font-weight="400" fill="#555555" text-anchor="end">tidak</text><text x="300" y="106" font-size="11" font-weight="700" fill="#111111" text-anchor="start">ya (Sabtu ini)</text><rect x="8" y="128" width="132" height="54" rx="8" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="74" y="150" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Renang Sabtu pagi</text><rect x="240" y="128" width="136" height="54" rx="8" fill="url(#hatch)" stroke="#111111" stroke-width="3"/><rect x="248" y="136" width="120" height="38" rx="5" fill="#fff" stroke="#111111" stroke-width="0"/><text x="308" y="152" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Renang dipindah ke</text><text x="308" y="166" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Minggu pagi</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Nadia berlatih renang setiap</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Sabtu pagi jika tidak ada ujian</text><text x="398" y="71" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">di sekolah.</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Jika ada ujian, latihan renang</text><text x="398" y="103" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">dipindah ke Minggu pagi.</text><text x="398" y="121.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Sabtu pagi ini Nadia ada ujian di</text><text x="398" y="135" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">sekolah.</text><text x="398" y="159.5" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="175.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">C. Nadia berlatih renang pada</text><text x="398" y="190" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Minggu pagi minggu ini.</text></svg>