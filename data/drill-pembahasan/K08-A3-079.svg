<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-A3-079" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Dua kelompok yang tidak bersinggungan</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><circle cx="86" cy="146" r="66" fill="#fff" stroke="#111111" stroke-width="2"/><text x="86" y="112" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Pabrik Sentosa</text><text x="86" y="128" font-size="9.5" font-weight="400" fill="#555555" text-anchor="middle">tidak menerima</text><text x="86" y="139" font-size="9.5" font-weight="400" fill="#555555" text-anchor="middle">karyawan baru</text><circle cx="292" cy="146" r="66" fill="#fff" stroke="#111111" stroke-width="2"/><text x="292" y="112" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">Karyawan baru</text><text x="292" y="124" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">minggu ini</text><circle cx="292" cy="152" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="292" y="176" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Nadia</text><line x1="154" y1="146" x2="224" y2="146" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M180 134 l14 24 M194 134 l-14 24" stroke="#111111" stroke-width="3"/><text x="189" y="200" font-size="10.5" font-weight="400" fill="#555555" text-anchor="middle">tidak bersinggungan</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Nadia mulai bekerja minggu ini.</text><text x="398" y="62.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Pabrik Sentosa sudah tiga bulan</text><text x="398" y="76" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">berhenti beroperasi dan belum</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">menerima karyawan baru.</text><text x="398" y="114" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="130" font-size="12" font-weight="700" fill="#111111" text-anchor="start">B. Nadia tidak bekerja di Pabrik</text><text x="398" y="144.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">Sentosa.</text></svg>