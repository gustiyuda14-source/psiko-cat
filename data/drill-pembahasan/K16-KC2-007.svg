<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K16-KC2-007" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="24" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">Yang ditanya:</text><text x="106" y="24" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Apakah putri lebih banyak dari putra? (ya/tidak)</text><rect x="16" y="42" width="84" height="34" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="63" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(1) saja</text><rect x="108" y="46" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="62.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="63" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Hanya membahas putri; tentang putra tidak ada informasi.</text><rect x="16" y="82" width="84" height="44" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="108" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(2) saja</text><rect x="108" y="91" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="107.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="100.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Peserta tari putri dan putra sama banyak, tetapi bagian</text><text x="232" y="115.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">yang ikut tidak diketahui.</text><rect x="16" y="132" width="84" height="44" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="158" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(1) + (2)</text><rect x="108" y="141" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="157.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="150.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Putri 10 → 4 ikut tari; putra bisa 8 (ya) atau 20</text><text x="232" y="165.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">(tidak).</text><rect x="16" y="184" width="584" height="24" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="308" y="200.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Jawaban: Opsi E — Digabung pun tetap tidak cukup</text></svg>