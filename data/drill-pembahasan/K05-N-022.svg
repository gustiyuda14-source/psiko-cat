ill="#555555" text-anchor="middle">5 = setengah dari 10</text><text x="348" y="180" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Kali 10 hanya menambah nol,</text><text x="348" y="198" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">lalu bagi 2: lebih ringan</text><text x="348" y="216" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">daripada simpan-menyimpan.</text></g></svg>