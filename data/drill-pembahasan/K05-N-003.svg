<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 97 kali 96 metode basis 100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">97 × 96 — basis 100</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="58" y="80" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">97</text><text x="146" y="80" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">−3</text><text x="58" y="122" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">96</text><text x="146" y="122" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">−4</text><line x1="102" y1="50" x2="102" y2="192" stroke="#111111" stroke-width="1"/><line x1="22" y1="136" x2="186" y2="136" stroke="#111111" stroke-width="2"/><line x1="86" y1="72" x2="124" y2="108" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="58" y="172" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">93</text><text x="146" y="172" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">12</text><text x="58" y="210" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">silang</text><text x="146" y="210" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">kali</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Jarak: −3 dan −4</text><text x="222" y="77" font-size="10" font-weight="400" fill="#555555" text-anchor="start">masing-masing ke 100</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Silang 97 − 4 = 93</text><text x="222" y="107" font-size="10" font-weight="400" fill="#555555" text-anchor="start">atau 96 − 3, sama</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Kali 3 × 4 = 12</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Gabung 93 | 12</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">9.312</text><g transform="translate(8,0)"><rect x="352" y="72" width="110" height="110" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="446" y="72" width="16" height="110" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="352" y="162" width="110" height="20" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><rect x="446" y="162" width="16" height="20" rx="0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="399" y="121" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">97 × 96</text><text x="454" y="68" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">3</text><text x="466" y="176" font-size="11" font-weight="700" fill="#111111" text-anchor="start">4</text><text x="482" y="86" font-size="12" font-weight="400" fill="#111111" text-anchor="start">100 × 100 = 10.000</text><text x="482" y="106" font-size="12" font-weight="400" fill="#111111" text-anchor="start">− pita 3 × 100</text><text x="482" y="126" font-size="12" font-weight="400" fill="#111111" text-anchor="start">− pita 4 × 100</text><text x="482" y="146" font-size="12" font-weight="400" fill="#111111" text-anchor="start">+ pojok 3 × 4</text><text x="482" y="166" font-size="12" font-weight="700" fill="#111111" text-anchor="start">= 9.300 + 12</text><text x="348" y="208" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pojok 3 × 4 (hitam) ikut terbuang</text><text x="348" y="225" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">dua kali, jadi dikembalikan sekali.</text></g></svg>