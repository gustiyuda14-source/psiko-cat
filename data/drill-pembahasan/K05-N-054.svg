<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 36 tambah 47 tambah 64 tambah 53" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">36 + 47 + 64 + 53 — pasangan 100</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="34" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">36</text><text x="78" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">47</text><text x="122" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">64</text><text x="166" y="112" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">53</text><text x="56" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><text x="100" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><text x="144" y="112" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">+</text><path d="M34 94 Q 78 54 122 92" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="78" y="66" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">100</text><path d="M78 122 Q 122 162 166 124" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="122" y="160" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">100</text><text x="100" y="204" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">100 + 100</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">36 + 64 = 100</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">47 + 53 = 100</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">100 + 100</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">200</text><g transform="translate(8,0)"><text x="348" y="88" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Urutan dan kelompok</text><text x="348" y="106" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">penjumlahan boleh diubah.</text><text x="348" y="136" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Pasangan satuan:</text><text x="348" y="154" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">6 + 4 = 10, 7 + 3 = 10</text><text x="352" y="178" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">Cari pasangan 1+9, 2+8, 3+7, 4+6, 5+5</text><text x="348" y="214" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Hasil antara jadi bulat:</text><text x="348" y="231" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">tidak ada simpanan berantai.</text></g></svg