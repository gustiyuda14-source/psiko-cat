<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 102 kali 97 basis 100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">102 × 97 — basis 100, beda arah</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="58" y="80" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">102</text><text x="146" y="80" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">+2</text><text x="58" y="122" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">97</text><text x="146" y="122" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">−3</text><line x1="102" y1="50" x2="102" y2="192" stroke="#111111" stroke-width="1"/><line x1="22" y1="136" x2="186" y2="136" stroke="#111111" stroke-width="2"/><line x1="86" y1="72" x2="124" y2="108" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="58" y="172" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">99</text><text x="146" y="172" font-size="28" font-weight="700" fill="#111111" text-anchor="middle">−6</text><text x="58" y="210" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">silang</text><text x="146" y="210" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">kali</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Jarak: +2 dan −3</text><text x="222" y="77" font-size="10" font-weight="400" fill="#555555" text-anchor="start">dari 100</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Silang → 99</text><text x="222" y="107" font-size="10" font-weight="400" fill="#555555" text-anchor="start">102 − 3 (atau 97 + 2)</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Kali 2 × (−3) = −6</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">9.900 − 6</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">9.894</text><g transform="translate(8,0)"><text x="420" y="72" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">100</text><text x="512" y="72" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">−3</text><text x="364" y="99" font-size="10" font-weight="400" fill="#555555" text-anchor="end">100</text><text x="364" y="135" font-size="10" font-weight="400" fill="#555555" text-anchor="end">2</text><rect x="368" y="76" width="104" height="38" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="420" y="94" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">100 × 100</text><text x="420" y="107" font-size="10.5" font-weight="400" fill="#555555" text-anchor="middle">10.000</text><rect x="472" y="76" width="80" height="38" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="512" y="94" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">100 × (−3)</text><text x="512" y="107" font-size="10.5" font-weight="400" fill="#555555" text-anchor="middle">−300</text><rect x="368" y="114" width="104" height="34" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="420" y="130" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">2 × 100</text><text x="420" y="143" font-size="10.5" font-weight="400" fill="#555555" text-anchor="middle">+200</text><rect x="472" y="114" width="80" height="34" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="512" y="130" font-size="11" font-weight="600" fill="#111111" text-anchor="middle">2 × (−3)</text><text x="512" y="143" font-size="10.5" font-weight="400" fill="#555555" text-anchor="middle">−6</text><text x="348" y="178" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">10.000 − 300 + 200 − 6</text><text x="348" y="196" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">= 9.900 − 6 = 9.894</text><text x="348" y="214" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Silang: −3 + 2 = −1 → −100.</text></g></svg>