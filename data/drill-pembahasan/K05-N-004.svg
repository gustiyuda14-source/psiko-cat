<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan 84 kali 125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">84 × 125 — kali 1000 bagi 8</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="76" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">84 × 125</text><line x1="100" y1="86" x2="100" y2="106" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="100" font-size="11" font-weight="400" fill="#555555" text-anchor="start">× 1000</text><rect x="30" y="110" width="140" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="131" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">84.000</text><line x1="100" y1="144" x2="100" y2="164" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="108" y="158" font-size="11" font-weight="400" fill="#555555" text-anchor="start">÷ 8</text><rect x="30" y="168" width="140" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="189" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">10.500</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="1