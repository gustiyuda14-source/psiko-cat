 y="125" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">125</text><rect x="472" y="80" width="30" height="32" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="487" y="125" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">125</text><rect x="502" y="80" width="30" height="32" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="517" y="125" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">125</text><rect x="532" y="80" width="30" height="32" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="547" y="125" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">125</text><rect x="562" y="80" width="30" height="32" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="577" y="125" font-size="9" font-weight="400" fill="#555555" text-anchor="middle">125</text><path d="M352 128 q0 10 10 10 h100 q10 0 10 10 q0 -10 10 -10 h100 q10 0 10 -10" fill="none" stroke="#111111" stroke-width="1.2"/><text x="472" y="166" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">8 × 125 = 1000</text><text x="348" y="200" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Jadi 125 = 1000 ÷ 8, sehingga</text><text x="348" y="217" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">× 125 = × 1000 lalu ÷ 8.</text><text x="348" y="234" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">Tambah nol + bagi 8: lebih ringan.</text></g></svg>