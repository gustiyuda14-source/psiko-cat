roke-width="1"/><text x="338" y="76" font-size="12.2" font-weight="400" fill="#111111" text-anchor="start">Bayu harus sebelum Gita, jadi Bayu</text><text x="338" y="92" font-size="12.2" font-weight="400" fill="#111111" text-anchor="start">pertama. Urutan 3 harus Citra atau Eka;</text><text x="338" y="108" font-size="12.2" font-weight="400" fill="#111111" text-anchor="start">jika Citra, Dimas harus ke-4 dan Fajar</text><text x="338" y="124" font-size="12.2" font-weight="400" fill="#111111" text-anchor="start">tidak kebagian tempat sebelum Ani. Jadi</text><text x="338" y="140" font-size="12.2" font-weight="400" fill="#111111" text-anchor="start">Eka ke-3, Fajar ke-4, Citra dan Dimas</text><text x="338" y="156" font-size="12.2" font-weight="400" fill="#111111" text-anchor="start">mengisi 6–7.</text><rect x="16" y="238" width="14" height="14" rx="0" fill="#111111" stroke="#111111" stroke-width="1"/><text x="36" y="250" font-size="11" font-weight="400" fill="#555555" text-anchor="start">pasti</text><rect x="80" y="238" width="14" height="14" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1"/><text x="100" y="250" font-size="11" font-weight="400" fill="#555555" text-anchor="start">mungkin</text><rect x="160" y="238" width="14" height="14" rx="0" fill="#fff" stroke="#111111" stroke-width="1"/><text x="180" y="250" font-size="11" font-weight="400" fill="#555555" text-anchor="start">tidak mungkin</text></svg>