<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K08-PR-062" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="10" y="22" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Cukup salah satu syarat</text><line x1="390" y1="14" x2="390" y2="248" stroke="#bbbbbb" stroke-width="1"/><rect x="8" y="62" width="180" height="52" rx="8" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="98" y="82" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Lari 2,4 km &lt; 12 menit</text><text x="98" y="106" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">Bagas: 11 menit</text><circle cx="188" cy="64" r="11" fill="#111111"/><text x="188" y="68" font-size="12.100000000000001" font-weight="700" fill="#fff" text-anchor="middle">✓</text><rect x="8" y="150" width="180" height="52" rx="8" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="98" y="170" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">Push-up > 40 kali</text><text x="98" y="194" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">Bagas: 35 kali</text><circle cx="188" cy="152" r="11" fill="#111111"/><text x="188" y="156" font-size="12.100000000000001" font-weight="700" fill="#fff" text-anchor="middle">✗</text><line x1="190" y1="90" x2="258" y2="124" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><line x1="190" y1="178" x2="258" y2="144" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="262" y="106" width="112" height="56" rx="8" fill="url(#hatch)" stroke="#111111" stroke-width="3"/><rect x="270" y="114" width="96" height="40" rx="5" fill="#fff" stroke="#111111" stroke-width="0"/><text x="318" y="139" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Lolos fisik</text><text x="318" y="188" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">cukup satu syarat</text><text x="398" y="26" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Premis</text><text x="398" y="44" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua pelamar yang berlari 2,4 km</text><text x="398" y="57.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">kurang dari 12 menit lolos tahap</text><text x="398" y="71" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">fisik.</text><text x="398" y="89.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Semua pelamar yang push-up lebih</text><text x="398" y="103" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">dari 40 kali lolos tahap fisik.</text><text x="398" y="121.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">Bagas berlari 2,4 km dalam 11</text><text x="398" y="135" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start">menit dan push-up 35 kali.</text><text x="398" y="159.5" font-size="11" font-weight="400" fill="#555555" text-anchor="start">Kesimpulan</text><text x="398" y="175.5" font-size="12" font-weight="700" fill="#111111" text-anchor="start">B. Bagas lolos tahap fisik.</text></svg>