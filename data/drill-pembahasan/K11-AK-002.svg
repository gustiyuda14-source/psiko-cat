<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K11-AK-002" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="700" fill="#111111" text-anchor="start">Jadwal piket 07.45–10.10</text><text x="16" y="44" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Blok pagi dan blok siang dipisah arahan pimpinan 08.50–09.05</text><text x="8" y="103" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">Laras</text><rect x="56" y="84" width="104.4" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="108.2" y="103" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Laporan 29</text><rect x="160.4" y="84" width="68.4" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="194.60000000000002" y="103" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Rekap 19</text><rect x="290" y="84" width="54" height="30" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="317" y="103" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Arahan</text><rect x="344" y="84" width="151.2" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="3"/><text x="419.6" y="103" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Materi 42</text><rect x="495.2" y="84" width="79.19999999999999" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="534.8" y="103" font-size="10.5"