111" text-anchor="start">Yoga</text><rect x="56" y="150" width="144" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="128" y="169" font-size="10.5" font-weight="600" fill="#111111" text-anchor="middle">Surat 40 (didelegasikan)</text><line x1="524" y1="66" x2="524" y2="82" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="524" y="62" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">materi selesai ≤ 09.55</text><line x1="290" y1="66" x2="290" y2="82" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="290" y="62" font-size="10" font-weight="400" fill="#555555" text-anchor="middle">laporan selesai &lt; 08.50</text><text x="16" y="206" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Surat didelegasikan (69 > 65 menit di blok pagi). Materi (42) tidak muat di blok pagi</text><text x="16" y="221" font-size="12" font-weight="400" fill="#111111" text-anchor="start">bersama laporan (71 > 65), jadi harus tugas pertama setelah arahan; bila didahului tugas</text><text x="16" y="236" font-size="12" font-weight="400" fill="#111111" text-anchor="start">lain, selesai lewat 09.55. Urutan sah: laporan, rekap | materi, mutasi · laporan, mutasi |</text><text x="16" y="251" font-size="12" font-weight="400" fill="#111111" text-anchor="start">materi, rekap · mutasi, laporan | materi, rekap.</text></svg>