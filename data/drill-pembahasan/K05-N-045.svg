<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan bilangan habis dibagi 9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Habis dibagi 9 — jumlah digit</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="14" y="70" font-size="13" font-weight="400" fill="#555555" text-anchor="start">3.462</text><text x="64" y="70" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">3+4+6+2 = 15</text><text x="180" y="70" font-size="13" font-weight="700" fill="#555555" text-anchor="start">✗</text><text x="14" y="98" font-size="13" font-weight="400" fill="#555555" text-anchor="start">5.217</text><text x="64" y="98" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">5+2+1+7 = 15</text><text x="180" y="98" font-size="13" font-weight="700" fill="#555555" text-anchor="start">✗</text><text x="14" y="126" font-size="13" font-weight="400" fill="#555555" text-anchor="start">6.034</text><text x="64" y="126" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">6+0+3+4 = 13</text><text x="180" y="126" font-size="13" font-weight="700" fill="#555555" text-anchor="start">✗</text><text x="14" y="154" font-size="13" font-weight="700" fill="#111111" text-anchor="start">7.236</text><text x="64" y="154" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">7+2+3+6 = 18</text><text x="180" y="154" font-size="13" font-weight="700" fill="#111111" text-anchor="start">✓</text><text x="14" y="182" font-size="13" font-weight="400" fill="#555555" text-anchor="start">9.371</text><text x="64" y="182" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">9+3+7+1 = 20</text><text x="180" y="182" font-size="13" font-weight="700" fill="#555555" text-anchor="start">✗</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Jumlah digit opsi</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Cari kelipatan 9</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">18 = 2 × 9 → habis</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">7.236</text><g transform="translate(8,0)"><text x="352" y="86" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start">7.236 = 7×1000 + 2×100 + 3×10 + 6</text><text x="352" y="110" font-size="12" font-weight="400" fill="#111111" text-anchor="start">1000 = 999 + 1</text><text x="352" y="128" font-size="12" font-weight="400" fill="#111111" text-anchor="start">100 = 99 + 1</text><text x="352" y="146" font-size="12" font-weight="400" fill="#111111" text-anchor="start">10 = 9 + 1</text><text x="464" y="128" font-size="11" font-weight="400" fill="#555555" text-anchor="start">999, 99, 9 habis</text><text x="464" y="144" font-size="11" font-weight="400" fill="#555555" text-anchor="start">dibagi 9: sisa 1</text><text x="348" y="184" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Sisa bagi 9 suatu bilangan</text><text x="348" y="202" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">= sisa bagi 9 jumlah digitnya.</text><text x="348" y="220" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Jumlah digit 18 → habis dibagi 9.</text></g></svg>