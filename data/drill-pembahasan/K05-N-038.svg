<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan kenaikan 40 menjadi 50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#111111" text-anchor="start">40 → 50 — persen naik</text><line x1="342" y1="42" x2="342" y2="244" stroke="#111111" stroke-width="1"/><text x="356" y="58" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Kenapa bisa?</text><text x="100" y="66" font-size="20" font-weight="700" fill="#111111" text-anchor="middle">40 → 50</text><rect x="35" y="82" width="130" height="30" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="100" y="103" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">selisih 10</text><line x1="100" y1="116" x2="100" y2="138" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/><text x="100" y="160" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">10 ÷ 40</text><text x="100" y="188" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">= ¼</text><text x="100" y="216" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">= 25%</text><circle cx="208" cy="60" r="8" fill="#111111"/><text x="208" y="64" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="222" y="64" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Selisih: 10</text><circle cx="208" cy="90" r="8" fill="#111111"/><text x="208" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="222" y="94" font-size="13" font-weight="600" fill="#111111" text-anchor="start">Bagi nilai AWAL</text><circle cx="208" cy="120" r="8" fill="#111111"/><text x="208" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="222" y="124" font-size="13" font-weight="600" fill="#111111" text-anchor="start">10 ÷ 40 = ¼</text><circle cx="208" cy="150" r="8" fill="#111111"/><text x="208" y="154" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="222" y="154" font-size="13" font-weight="600" fill="#111111" text-anchor="start">¼ = 25%</text><rect x="200" y="184" width="130" height="40" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="265" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">25%</text><g transform="translate(8,0)"><rect x="352" y="84" width="40" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="392" y="84" width="40" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="432" y="84" width="40" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="472" y="84" width="40" height="30" rx="0" fill="#fff" stroke="#111111" stroke-width="1.5"/><rect x="512" y="84" width="40" height="30" rx="0" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/><text x="432" y="130" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">awal 40 = 4 bagian</text><text x="532" y="130" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">+10</text><text x="348" y="160" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Persen naik = selisih ÷ AWAL.</text><text x="348" y="178" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">Dibagi nilai akhir (10 ÷ 50 = 20%)</text><text x="348" y="196" font-size="12.5" font-weight="600" fill="#111111" text-anchor="start">itu persen turun dari 50.</text></g></svg>