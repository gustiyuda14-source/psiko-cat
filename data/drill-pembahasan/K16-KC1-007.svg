<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 260" width="616" height="260" role="img" aria-label="Pembahasan K16-KC1-007" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.2"/></pattern></defs><rect width="616" height="260" fill="#fff"/><text x="16" y="24" font-size="12.5" font-weight="700" fill="#111111" text-anchor="start">Yang ditanya:</text><text x="106" y="24" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Kotak yang paling berat</text><rect x="16" y="42" width="84" height="44" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="68" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(1) saja</text><rect x="108" y="51" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="67.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="60.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">P lebih berat dari Q; R bisa di atas P, di antara, atau</text><text x="232" y="75.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">di bawah Q.</text><rect x="16" y="92" width="84" height="34" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="113" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(2) saja</text><rect x="108" y="96" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="112.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="113" font-size="12" font-weight="400" fill="#111111" text-anchor="start">R lebih berat dari Q; kotak P tidak disebut.</text><rect x="16" y="132" width="84" height="44" rx="6" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="58" y="158" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">(1) + (2)</text><rect x="108" y="141" width="112" height="26" rx="13" fill="#fff" stroke="#111111" stroke-width="1.5"/><text x="164" y="157.96" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">TIDAK CUKUP ✗</text><text x="232" y="150.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">Q pasti paling ringan, tetapi P dan R tidak</text><text x="232" y="165.5" font-size="12" font-weight="400" fill="#111111" text-anchor="start">dibandingkan: P–R–Q dan R–P–Q sama-sama mungkin.</text><rect x="16" y="184" width="584" height="24" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="308" y="200.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Jawaban: Opsi A — Digabung pun tetap tidak cukup</text></svg>