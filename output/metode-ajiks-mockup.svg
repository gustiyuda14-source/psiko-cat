.k{font-size:24px;font-weight:700;letter-spacing:5px;fill:#d6b766}
.t{font-size:64px;font-weight:800;fill:#f2f4fb}
.s{font-size:28px;fill:#a3abcb}
.h{font-size:32px;font-weight:700;fill:#f2f4fb}
